# 資料庫用的是 Supabase（見 DATABASE_URL secret），不是 Cloud SQL，
# 所以沒有 --add-cloudsql-instances 也沒有 _CLOUD_SQL_CONNECTION_NAME。
substitutions:
  _REGION: asia-east1
  _SERVICE_NAME: zeno
  _AR_REPOSITORY: cloud-run
  _APP_BASE_URL: https://replace-me.run.app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --startup-probe
      - httpGet.path=/api/health,httpGet.port=8080,initialDelaySeconds=5,periodSeconds=5,failureThreshold=24,timeoutSeconds=3
      - --liveness-probe
      - httpGet.path=/api/health,httpGet.port=8080,initialDelaySeconds=30,periodSeconds=30,failureThreshold=3,timeoutSeconds=3
      - --memory
      - 1Gi
      - --cpu
      - "1"
      # 縮到零：沒有請求時不計費，低流量下大致落在 Cloud Run 免費額度內。
      # 代價是冷啟動時第一個請求慢 2–5 秒。
      #
      # 注意：min-instances=0 之後，instrumentation.ts 裡的 node-cron 不會可靠執行
      # （容器閒置就被回收了）。排程改由 Cloud Scheduler 呼叫對應 API，
      # 設定見 docs/gcp-cloud-run.md 第 5 節。
      - --min-instances
      - "0"
      - --max-instances
      - "1"
      - --set-env-vars
      - NODE_ENV=production,APP_BASE_URL=${_APP_BASE_URL}
      # Google / Apple 登入的憑證也要帶進去：App Review 一定會測社群登入，
      # 少了這些 secret 登入會直接失敗，等於再送一次「功能無法審查」的版本。
      - --set-secrets
      - DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,ENCRYPTION_KEY=ENCRYPTION_KEY:latest,CRON_SECRET=CRON_SECRET:latest,GOOGLE_CLIENT_ID=GOOGLE_CLIENT_ID:latest,GOOGLE_CLIENT_SECRET=GOOGLE_CLIENT_SECRET:latest,APPLE_CLIENT_ID=APPLE_CLIENT_ID:latest,APPLE_TEAM_ID=APPLE_TEAM_ID:latest,APPLE_KEY_ID=APPLE_KEY_ID:latest,APPLE_PRIVATE_KEY=APPLE_PRIVATE_KEY:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
